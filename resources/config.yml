# VivaArcade runtime settings
parkour:
  reward-dollar: 50
  reward-xp: 30

# Once-per-UTC-day reward. The reset boundary is 00:00 UTC.
daily-reward:
  reward-dollar: 100
  reward-xp: 25

# Temporary online parties; invitations are UUID-bound and expire automatically.
party:
  max-members: 8
  invite-ttl-seconds: 60
