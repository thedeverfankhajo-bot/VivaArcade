name: VivaArcade
main: VivaArcade\Main
src-namespace-prefix: VivaArcade
version: 0.5.0
api: 5.0.0
load: POSTWORLD
author: VivaArcade Contributors
description: Native Minecraft Bedrock arcade foundation for PocketMine-MP API 5
website: https://github.com/thedeverfankhajo-bot/VivaArcade
commands:
  arcade:
    description: Open the VivaArcade main menu
    usage: "/arcade"
    permission: vivaarcade.command
  games:
    description: Browse available games
    usage: "/games"
    permission: vivaarcade.command
  profile:
    description: View your VivaArcade profile
    usage: "/profile"
    permission: vivaarcade.command
  stats:
    description: View your game statistics
    usage: "/stats"
    permission: vivaarcade.command
  balance:
    description: View your Dollar balance
    usage: "/balance"
    permission: vivaarcade.command
  leave:
    description: Leave your active game
    usage: "/leave"
    permission: vivaarcade.command
  spawn:
    description: Return to the arcade lobby
    usage: "/spawn"
    permission: vivaarcade.command
permissions:
  vivaarcade.command:
    description: Allows access to VivaArcade player commands
    default: true
  vivaarcade.admin:
    description: Allows access to VivaArcade administration commands
    default: op
